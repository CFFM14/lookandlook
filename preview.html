<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>水果连连看 · 界面预览</title>
<style>
  body { background:#2b2b35; margin:0; font-family: sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px 0; }
  h1 { color:#ffe9a8; font-size:18px; margin:0 0 10px; }
  .bar { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; justify-content:center; }
  .bar button { padding:8px 18px; border-radius:10px; border:2px solid #e8b34b; background:#fff6dc; color:#8b5a2b; font-size:14px; font-weight:bold; cursor:pointer; }
  .bar button:hover { background:#ffe9a8; }
  .wrap { position:relative; border-radius:18px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  canvas { display:block; background:#000; }
  .tip { color:#999; font-size:12px; margin-top:10px; }
</style>
</head>
<body>
<h1>🍉 水果连连看 · 微信小游戏界面预览（浏览器模拟）</h1>
<div class="bar">
  <button onclick="showPage('menu')">首页</button>
  <button onclick="showPage('levels')">关卡选择</button>
  <button onclick="showPage('game')">游戏页</button>
  <button onclick="showPage('win')">🎉 结算面板（新版）</button>
</div>
<div class="wrap"><canvas id="game"></canvas></div>
<div class="tip">直接复用游戏真实渲染代码；结算面板为全新程序绘制版本（金色渐变+成绩三卡+新纪录徽章+弹入动画）</div>

<script>
// ── mock 微信环境（浏览器预览用） ──────────────
window.GameGlobal = {};
var memStore = { 'look_best_1': { moves: 6, elapsed: 35 }, 'look_unlocked': '2' };
var touchHandlers = {};
var wx = {
  getSystemInfoSync: function () { return { windowWidth: 390, windowHeight: 844, pixelRatio: 2 }; },
  createCanvas: function () { return document.getElementById('game'); },
  createImage: function () { return new Image(); },
  onTouchStart: function (fn) { touchHandlers.start = fn; },
  onTouchMove: function (fn) { touchHandlers.move = fn; },
  onTouchEnd: function (fn) { touchHandlers.end = fn; },
  getStorageSync: function (k) { return memStore[k] !== undefined ? memStore[k] : ''; },
  setStorageSync: function (k, v) { memStore[k] = v; },
  createInnerAudioContext: function () { return { stop: function(){}, play: function(){}, seek: function(){}, src: '', volume: 1 }; },
};

// ── 加载真实游戏模块（与 game.js 同顺序） ───────
document.write('<script src="js/config.js"><\/script>');
document.write('<script src="js/storage.js"><\/script>');
document.write('<script src="js/pathChecker.js"><\/script>');
document.write('<script src="js/audio.js"><\/script>');
document.write('<script src="js/game.js"><\/script>');
document.write('<script src="js/render.js"><\/script>');
document.write('<script src="js/ui.js"><\/script>');
document.write('<script src="js/main.js"><\/script>');

// canvas 放大 1.25 倍显示
document.getElementById('game').style.width = (390 * 1.25) + 'px';
document.getElementById('game').style.height = (844 * 1.25) + 'px';

// ── 页面切换 ───────────────────────────────────
function showPage(page) {
  if (!GameGlobal.Main || !GameGlobal.Main._ready) return;
  var Main = GameGlobal.Main, Game = GameGlobal.Game;
  if (page === 'menu') {
    Main.page = 'menu'; Main.game = null; Main.winData = null;
  } else if (page === 'levels') {
    Main.page = 'levels'; Main.game = null;
  } else if (page === 'game') {
    Main.game = new Game(2); Main.page = 'game'; Main.winData = null;
  } else if (page === 'win') {
    Main.game = new Game(1);
    Main.winData = { levelId: 1, moves: 6, elapsed: 35 };
    Main.winShownAt = Date.now() - 600; // 弹入动画进行中
    Main.page = 'win';
  }
}
// 图片加载完成后默认展示结算面板
(function wait() {
  if (GameGlobal.Main && GameGlobal.Main._ready) showPage('win');
  else setTimeout(wait, 100);
})();

// ── 鼠标模拟触摸（浏览器里也能点按钮 / 拖动滚动关卡列表） ──
(function () {
  var canvas = document.getElementById('game');
  var down = false;
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return {
      clientX: (e.clientX - r.left) * 390 / r.width,
      clientY: (e.clientY - r.top) * 844 / r.height,
    };
  }
  function mk(p) {
    return { touches: [{ clientX: p.clientX, clientY: p.clientY }], changedTouches: [{ clientX: p.clientX, clientY: p.clientY }] };
  }
  canvas.addEventListener('mousedown', function (e) {
    down = true;
    if (touchHandlers.start) touchHandlers.start(mk(pos(e)));
  });
  window.addEventListener('mousemove', function (e) {
    if (down && touchHandlers.move) touchHandlers.move(mk(pos(e)));
  });
  window.addEventListener('mouseup', function (e) {
    if (down && touchHandlers.end) touchHandlers.end(mk(pos(e)));
    down = false;
  });
})();
</script>
</body>
</html>
